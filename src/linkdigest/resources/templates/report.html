<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="generator" content="linkdigest">
<style>
:root {
  --paper: #fbfaf7;
  --ink: #1b1d20;
  --ink-2: #454a50;
  --muted: #7c8289;
  --rule: #e6e2da;
  --rule-soft: #f0ece4;
  --accent: #0e7a5a;
  --accent-soft: #e9f4ef;
  --code-bg: #f2efe8;
  --warn-bg: #fdf6e7;
  --warn-rule: #d9a441;
  --measure: 43rem;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131518;
    --ink: #e7e9eb;
    --ink-2: #b6bcc3;
    --muted: #838a92;
    --rule: #282c31;
    --rule-soft: #1e2226;
    --accent: #6ed3ae;
    --accent-soft: #16302a;
    --code-bg: #1b1e22;
    --warn-bg: #2a2417;
    --warn-rule: #c39a44;
  }
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.sheet {
  max-width: var(--measure);
  margin: 0 auto;
  padding: 72px 24px 96px;
}

/* ---------- 页头 ---------- */

.head { margin-bottom: 28px; }

.kicker {
  margin: 0 0 14px;
  font: 11px/1.4 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

h1 {
  margin: 0 0 16px;
  font-size: clamp(26px, 4.4vw, 34px);
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.012em;
  text-wrap: balance;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin: 0 0 10px;
}

.chip {
  font: 11.5px/1 var(--mono);
  color: var(--ink-2);
  border: 1px solid var(--rule);
  border-radius: 999px;
  padding: 5px 9px;
  white-space: nowrap;
}

.chip b { font-weight: 500; color: var(--ink); }

.source {
  margin: 0;
  font-size: 13px;
  color: var(--muted);
  word-break: break-all;
}
.source a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
.source a:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- 标签区 + 导语 ---------- */

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 26px 0 0;
}
.tag {
  font: 12px/1 var(--sans);
  font-weight: 500;
  color: var(--accent);
  background: var(--accent-soft);
  border-radius: 999px;
  padding: 6px 12px;
}

.oneline {
  margin: 22px 0 0;
  font-size: 20px;
  line-height: 1.65;
  font-weight: 600;
  letter-spacing: -0.008em;
  text-wrap: pretty;
}

.degraded {
  margin: 26px 0 0;
  padding: 12px 16px;
  background: var(--warn-bg);
  border-left: 2px solid var(--warn-rule);
  border-radius: 0 6px 6px 0;
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--ink-2);
}

/* ---------- 章节骨架 ---------- */

h2 {
  margin: 56px 0 18px;
  padding-bottom: 9px;
  border-bottom: 1px solid var(--rule);
  font: 500 12px/1.5 var(--mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ---------- 速览 ---------- */

.tldr {
  list-style: none;
  counter-reset: tldr;
  margin: 0;
  padding: 0;
}
.tldr li {
  counter-increment: tldr;
  position: relative;
  padding: 0 0 0 34px;
  margin: 0 0 12px;
  font-size: 16.5px;
  line-height: 1.72;
  text-wrap: pretty;
}
.tldr li::before {
  content: counter(tldr);
  position: absolute;
  left: 0;
  top: 3px;
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font: 11px/21px var(--mono);
  text-align: center;
}

/* ---------- 目录 ---------- */

.toc {
  list-style: none;
  margin: 0;
  padding: 0;
}
.toc li {
  display: flex;
  gap: 12px;
  align-items: center;
  border-bottom: 1px solid var(--rule-soft);
}
.toc li:last-child { border-bottom: 0; }
.toc .toc-title {
  flex: 1;
  padding: 10px 0;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 15px;
  line-height: 1.55;
}
.toc .toc-title:hover { color: var(--accent); }
.toc .ts { flex: none; }

/* ---------- 正文 ---------- */

.prose { margin-top: 4px; }

.prose p { margin: 0 0 1.15em; text-wrap: pretty; }
.prose > :first-child { margin-top: 0; }

.prose h3 {
  margin: 2.1em 0 0.6em;
  font-size: 19px;
  line-height: 1.45;
  font-weight: 600;
  letter-spacing: -0.006em;
}
.prose h4 {
  margin: 1.7em 0 0.4em;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink-2);
}

.prose ul, .prose ol { margin: 0 0 1.15em; padding-left: 1.35em; }
.prose li { margin: 0.32em 0; }
.prose li::marker { color: var(--muted); }

.prose strong { font-weight: 600; }
.prose em { font-style: normal; background: linear-gradient(transparent 62%, var(--accent-soft) 62%); }

.prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
.prose a:hover { border-color: var(--accent); }

.prose code {
  font: 0.86em/1.5 var(--mono);
  background: var(--code-bg);
  padding: 0.14em 0.4em;
  border-radius: 4px;
}
.prose pre {
  background: var(--code-bg);
  padding: 15px 17px;
  border-radius: 8px;
  overflow-x: auto;
  margin: 0 0 1.2em;
}
.prose pre code { background: none; padding: 0; font-size: 13px; }

.prose blockquote {
  margin: 1.4em 0;
  padding: 0.1em 0 0.1em 1.1em;
  border-left: 2px solid var(--rule);
  color: var(--ink-2);
}

.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 2.4em 0; }

.prose table {
  width: 100%;
  border-collapse: collapse;
  margin: 0 0 1.3em;
  font-size: 15px;
  line-height: 1.6;
}
.prose th {
  text-align: left;
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: 0.04em;
  color: var(--muted);
  border-bottom: 1px solid var(--rule);
  padding: 8px 10px 8px 0;
}
.prose td { border-bottom: 1px solid var(--rule-soft); padding: 9px 10px 9px 0; vertical-align: top; }
.prose tr:last-child td { border-bottom: 0; }

/* ---------- 时间码 ---------- */

.ts {
  display: inline-block;
  font: 11.5px/1 var(--mono);
  letter-spacing: 0.02em;
  color: var(--muted);
  background: var(--code-bg);
  border-radius: 4px;
  padding: 4px 6px;
  text-decoration: none;
  white-space: nowrap;
}
a.ts:hover { color: var(--accent); }

/* ---------- 分段索引 ---------- */

.index {
  list-style: none;
  margin: 0;
  padding: 0;
}
.index li {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 2px 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-soft);
}
.index li:last-child { border-bottom: 0; }
.index .ts { grid-column: 1; grid-row: 1; }
.index .idx-title {
  grid-column: 2;
  grid-row: 1;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.55;
  color: var(--ink);
}
.index .idx-gloss {
  grid-column: 2;
  grid-row: 2;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.65;
}

/* ---------- 列表型区块 ---------- */

.bullets { margin: 0; padding-left: 1.3em; }
.bullets li { margin: 0.35em 0; }

/* ---------- 表格 ---------- */

.grid {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  line-height: 1.6;
}
.grid th {
  text-align: left;
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--rule);
  padding: 8px 12px 8px 0;
}
.grid td { border-bottom: 1px solid var(--rule-soft); padding: 10px 12px 10px 0; vertical-align: top; }
.grid td.num { font-family: var(--mono); font-size: 13.5px; font-weight: 500; color: var(--accent); }
.grid .pos { text-align: right; padding-right: 0; white-space: nowrap; }
.grid tr:last-child td { border-bottom: 0; }

/* ---------- 原话 ---------- */

.quote {
  margin: 0 0 22px;
  padding-left: 18px;
  border-left: 2px solid var(--accent);
}
.quote p {
  margin: 0;
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink);
}
.quote-foot {
  display: flex;
  gap: 12px;
  align-items: baseline;
  margin-top: 9px;
}
.quote-foot .note {
  margin: 0;
  flex: 1;
  font-size: 13px;
  line-height: 1.6;
  color: var(--muted);
}
.quote-foot .ts { flex: none; }

/* ---------- 术语 ---------- */

.terms { margin: 0; }
.terms div {
  display: grid;
  grid-template-columns: minmax(96px, 20%) 1fr;
  gap: 14px;
  padding: 9px 0;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 15px;
}
.terms div:last-child { border-bottom: 0; }
.terms dt { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--accent); word-break: break-word; }
.terms dd { margin: 0; color: var(--ink-2); }

/* ---------- 附录 ---------- */

.appendix { margin-top: 8px; }
.appendix .prose > :first-child { margin-top: 0; }
.appendix .prose { margin-top: 0; }

/* ---------- 页脚 ---------- */

.foot {
  margin-top: 64px;
  padding-top: 18px;
  border-top: 1px solid var(--rule);
  font: 11.5px/1.8 var(--mono);
  color: var(--muted);
}
.foot p { margin: 0; }
.foot .intent-foot { margin-top: 8px; color: var(--ink-2); font-family: var(--sans); font-size: 12.5px; }
.foot .warn { color: var(--ink-2); margin-top: 8px; }
.foot ul { margin: 8px 0 0; padding-left: 1.2em; }

/* ---------- 窄屏 ---------- */

@media (max-width: 620px) {
  body { font-size: 16.5px; }
  .sheet { padding: 44px 18px 64px; }
  h2 { margin-top: 44px; }
  .terms div { grid-template-columns: 1fr; gap: 4px; }
  .prose table, .grid { font-size: 14px; }
}

/* ---------- 打印 ---------- */

@media print {
  :root {
    --paper: #fff;
    --ink: #000;
    --ink-2: #333;
    --muted: #666;
    --rule: #ccc;
    --rule-soft: #e5e5e5;
    --accent: #000;
    --accent-soft: #f2f2f2;
    --code-bg: #f5f5f5;
  }
  body { font-size: 11pt; line-height: 1.65; }
  .sheet { max-width: none; padding: 0; }
  h1 { font-size: 20pt; }
  h2 { margin-top: 22pt; break-after: avoid; }
  .prose h3, .index .idx-title { break-after: avoid; }
  .index li, .quote, .grid tr { break-inside: avoid; }
  a { color: inherit; border: 0; text-decoration: none; }
  .toc { display: none; }
  .foot { margin-top: 28pt; }
}
</style>
</head>
<body>
<main class="sheet">
  <header class="head">
    <p class="kicker">{{KICKER}}</p>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{META}}</p>
    {{SOURCE}}
  </header>
{{TAGS}}
{{LEAD}}
{{NAV}}
{{MAIN}}
{{APPENDIX}}
  <footer class="foot">
{{FOOTER}}
  </footer>
</main>
</body>
</html>
