[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "linkdigest"
version = "0.1.0"
description = "把视频 / 播客 / 文章链接变成带时间码、可回查的结构化总结报告"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chrissish", email = "shiqian1022@163.com" }]
keywords = ["asr", "whisper", "transcription", "summarization", "llm", "podcast", "youtube", "markdown"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "markdown>=3.6",
  "yt-dlp>=2024.8.6",
  "yt-dlp-ejs>=0.8.0",
  "feedparser>=6.0",
  "trafilatura>=1.12",
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
ocr = ["rapidocr>=1.4", "onnxruntime>=1.19"]
mlx = ["mlx-whisper>=0.4"]
dev = ["ruff>=0.6"]

[project.scripts]
linkdigest = "linkdigest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 非代码资源随包分发：提示词、模板、报错文案、网页。
linkdigest = [
  "resources/*/*",
  "resources/web/static/*",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# 只开高信号规则：语法 / 未定义名 / 未使用导入 / 导入排序。
# 不强制格式化风格，避免整库重排把真实改动埋掉。
select = ["E4", "E7", "E9", "F", "I"]
