name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src scripts tests

  selftest:
    name: selftest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 自检只碰确定性层，不需要 torch / faster-whisper / yt-dlp。
      # 只装它真的用到的那几个包，让 CI 在 30 秒内跑完。
      - run: pip install pydantic httpx python-dotenv
      - run: python scripts/selftest.py
